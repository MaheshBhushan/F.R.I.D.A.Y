[project]
name = "friday"
version = "0.1.0"
description = "FRIDAY - voice-first personal AI assistant"
requires-python = ">=3.11"
dependencies = [
    "openwakeword>=0.6.0",
    "onnxruntime>=1.29.0",
    "sounddevice>=0.5.6",
    "psutil",
    "deepgram-sdk>=7.7.0",
    "webrtcvad-wheels>=2.0.14",
    "anthropic>=1.0.0",
    "httpx>=0.28.1",
    # Direct dependency of the gateway. It already arrives transitively via
    # deepgram-sdk, but relying on that would let a Deepgram bump silently
    # remove the control plane.
    "websockets>=12.0",
]

[project.scripts]
friday = "friday.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
dashboard = ["Flask>=3.1,<4"]
local = ["transformers>=4.45", "torch>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100
extend-exclude = ["training", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # SYSTEM_PROMPT and tool descriptions are cached-prefix bytes; never rewrap them
    "UP031",  # printf-style formatting is fine in test diagnostics
    "UP042",  # (str, Enum) -> StrEnum changes str() output that callers print
]

[tool.ruff.lint.isort]
known-first-party = ["friday"]
