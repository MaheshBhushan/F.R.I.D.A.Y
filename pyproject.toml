[project]
name = "friday"
version = "0.1.0"
description = "FRIDAY - voice-first personal AI assistant"
requires-python = ">=3.11"
dependencies = [
    "openwakeword>=0.6.0",
    "onnxruntime>=1.29.0",
    "sounddevice>=0.5.6",
    "psutil",
    "deepgram-sdk>=7.7.0",
    "webrtcvad-wheels>=2.0.14",
    "anthropic>=1.0.0",
    "httpx>=0.28.1",
    # Direct dependency of the gateway. It already arrives transitively via
    # deepgram-sdk, but relying on that would let a Deepgram bump silently
    # remove the control plane.
    "websockets>=12.0",
]

[project.scripts]
friday = "friday.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
